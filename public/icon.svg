<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Radar pulse circles in background -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="#38bdf8" stroke-opacity="0.1" stroke-width="2"/>
  <circle cx="256" cy="240" r="120" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Bluetooth Antenna Waves -->
  <path d="M196 140 C214 122 234 112 256 112 C278 112 298 122 316 140" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M166 110 C192 84 223 70 256 70 C289 70 320 84 346 110" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

  <!-- Car outline & Diagnostic Hub -->
  <g transform="translate(64, 130)">
    <!-- OBD2 Dongle Body -->
    <rect x="112" y="160" width="160" height="90" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="4" filter="url(#glow)"/>
    
    <!-- OBD Pins -->
    <g fill="#38bdf8">
      <rect x="132" y="148" width="8" height="14" rx="2"/>
      <rect x="152" y="148" width="8" height="14" rx="2"/>
      <rect x="172" y="148" width="8" height="14" rx="2"/>
      <rect x="192" y="148" width="8" height="14" rx="2"/>
      <rect x="212" y="148" width="8" height="14" rx="2"/>
      <rect x="224" y="148" width="8" height="14" rx="2"/>
      <rect x="244" y="148" width="8" height="14" rx="2"/>
    </g>

    <!-- Bluetooth Emblem on Dongle -->
    <path d="M192 180 L192 230 L208 218 L180 196 L208 174 L192 162 Z" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Status LEDs on Dongle -->
    <circle cx="136" cy="225" r="5" fill="#10b981" filter="url(#glow)"/>
    <circle cx="152" cy="225" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="248" cy="225" r="5" fill="#f59e0b" filter="url(#glow)"/>

    <!-- Check Engine Light Symbol above OBD -->
    <path d="M142 60 L158 60 L158 72 L172 72 L182 50 L202 50 L212 72 L226 72 L226 60 L242 60 L242 108 L226 108 L226 100 L158 100 L158 108 L142 108 Z" 
          fill="url(#accent)" filter="url(#glow)"/>
    <circle cx="192" cy="85" r="9" fill="#0f172a"/>
  </g>

  <!-- Sound Waves (Voice feature indicator) -->
  <g stroke="#10b981" stroke-width="5" stroke-linecap="round" filter="url(#glow)">
    <path d="M 90 280 Q 70 310 90 340" fill="none"/>
    <path d="M 70 260 Q 40 310 70 360" fill="none" opacity="0.6"/>
    <path d="M 422 280 Q 442 310 422 340" fill="none"/>
    <path d="M 442 260 Q 472 310 442 360" fill="none" opacity="0.6"/>
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="2">
    OBD2 AUTO VOICE
  </text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">
    فحص ذكي • تنبيه صوتي فوري
  </text>
</svg>
